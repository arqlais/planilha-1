<body>
<div id="root"><p style="padding:40vh 20px 0;text-align:center;color:#5F6B7A;font-family:system-ui,sans-serif">Carregando…</p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================== FIREBASE ==================
   Login de verdade (e-mail e senha) e dados guardados no Firestore, compartilhados entre
   aluno, professor e empresa. Sem a biblioteca do Firebase (ou sem configuração), o site
   volta ao modo demonstração, com tudo salvo só no navegador.
   As permissões de cada tipo de conta ficam em firestore.rules. */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyDDiaqBsFnSG7-o-0hzfo47hXQBXpG39Z8",
  authDomain:"primeiro-passo-a792c.firebaseapp.com",
  projectId:"primeiro-passo-a792c",
  storageBucket:"primeiro-passo-a792c.firebasestorage.app",
  messagingSenderId:"886654017067",
  appId:"1:886654017067:web:ccce25b3b422ffd59c146e"
};
/* DEMO: o link com ?demo (atalho em demo/) abre só com dados de exemplo, sem senha e sem tocar no banco de verdade.
   Guarda tudo em chaves próprias deste navegador, separadas do app real. */
const DEMO=/[?&]demo\b/.test(location.search),DK=DEMO?":demo2":"";
const FB=!DEMO&&!!(window.firebase&&FIREBASE_CONFIG.apiKey);
/* ME: id do aluno logado ("me" no modo demonstração). AL: outros alunos carregados nos painéis. */
let ME=FB?null:"me",AL={};
const A=id=>id==null?null:id===ME?(S.profile?S:null):(AL[id]||null);
const alIds=()=>[...(ME&&S.profile?[ME]:[]),...Object.keys(AL)];
const saveA=id=>id===ME?save():FBL.saveAluno(id);

const FBL=(()=>{
  if(!FB)return{booted:true};
  const app=firebase.initializeApp(FIREBASE_CONFIG),auth=firebase.auth(),db=firebase.firestore();
  if(/[?&]emulador\b/.test(location.search)){auth.useEmulator("http://127.0.0.1:9099");db.useEmulator("127.0.0.1",8080)}
  const FV=firebase.firestore.FieldValue;
  const J=v=>JSON.stringify(v===undefined?null:v);
  const clean=o=>JSON.parse(JSON.stringify(o));
  const PUB=["name","cref","uf","area","bio","spec","status","cap","since"],PRIV=["email","split","safety","terms","payout","info"];
  const CFG=["prices","disc","fees","methodsOn","payoutDay","teste"],CFGI=["split"]; /* CFGI: só empresa e professores leem (config/interno) */
  const COLS={leads:"contatos",ratings:"avaliacoes",incidents:"relatos",flags:"alertas"};
  const pick=(o,ks)=>{const r={};ks.forEach(k=>{if(o[k]!==undefined)r[k]=o[k]});return r};
  const warn=(what,e)=>console.warn("[firebase]",what,e&&e.code||e);
  let SYNC={},DBS={},PAYPID={},subs=[],timers={},dbTimer=null,rr=null;
  const F={booted:false,ready:false,busy:false,role:null,uid:null};

  /* ---------- carregar ---------- */
  function reset(){subs.forEach(u=>{try{u()}catch(e){}});subs=[];SYNC={};DBS={personais:{},priv:{},pag:{},rep:{},chk:{},cfg:null,cfgi:null};PAYPID={};
    Object.values(COLS).forEach(c=>DBS[c]={});AL={};ME=null;S=fresh();DB=emptyDB();F.role=null;F.uid=null;F.ready=false}
  const docs=async(q,what)=>{try{return(await q.get()).docs}catch(e){warn(what,e);return[]}};
  const one=async(ref,what)=>{try{const d=await ref.get();return d.exists?d.data():null}catch(e){warn(what,e);return null}};
  function addPersonal(id,pub,priv){let p=DB.personals.find(x=>x.id===id);if(!p){p={id};DB.personals.push(p)}
    Object.assign(p,pub||{},priv||{});DBS.personais[id]=J(pick(p,PUB));DBS.priv[id]=J(pick(p,PRIV))}
  function addList(k,col,list){list.forEach(d=>{const o=Object.assign({id:d.id},d.data());DB[k].push(o);DBS[col][d.id]=J(o)})}
  function addPays(list){list.forEach(d=>{const x=d.data(),k=d.id;DB.paid[k]=!!x.paid;if(x.metodo)DB.payInfo[k]={m:x.metodo,at:x.at||null};if(x.informado)DB.informed[k]=true;PAYPID[k]=x.pid||null;DBS.pag[k]=J(payDoc(k))})}
  function addReps(list){list.forEach(d=>{DB.payouts[d.id]=d.data().at;DBS.rep[d.id]=J(d.data().at)})}
  function addChks(list){list.forEach(d=>{const x=d.data();DB.checkins[d.id]={in:x.in||null,out:x.out||null};DBS.chk[d.id]=J(DB.checkins[d.id])})}
  function watchAlunos(q){subs.push(q.onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type==="removed"){delete AL[ch.doc.id];return}remote(ch.doc.id,ch.doc.data(),ch.doc.metadata.hasPendingWrites)});rerender()},e=>warn("alunos",e)))}

  async function loadFor(u){
    reset();
    const cfg=await one(db.collection("config").doc("empresa"),"config");
    if(cfg)CFG.forEach(k=>{if(cfg[k]!==undefined)DB[k]=cfg[k]});DBS.cfg=J(pick(DB,CFG));
    if(!u){(await docs(db.collection("personais").where("status","==","ativo"),"personais")).forEach(d=>addPersonal(d.id,d.data()));finish();return}
    F.uid=u.uid;
    const isAdm=await one(db.collection("admins").doc(u.uid),"admins");
    const usr=isAdm?null:await one(db.collection("usuarios").doc(u.uid),"usuarios");
    F.role=isAdm?"admin":usr?usr.role:null;
    if(F.role==="admin"||F.role==="personal"){const ci=await one(db.collection("config").doc("interno"),"config");if(ci)CFGI.forEach(k=>{if(ci[k]!==undefined)DB[k]=ci[k]});DBS.cfgi=J(pick(DB,CFGI))}
    const P=db.collection("personais"),PV=db.collection("personaisPriv"),AU=db.collection("alunos");
    if(F.role==="admin"){
      const [ps,pv]=await Promise.all([docs(P,"personais"),docs(PV,"personaisPriv")]);
      ps.forEach(d=>addPersonal(d.id,d.data(),(pv.find(x=>x.id===d.id)||{data:()=>({})}).data()));
      const [pg,rp,ck]=await Promise.all(["pagamentos","repasses","checkins"].map(c=>docs(db.collection(c),c)));addPays(pg);addReps(rp);addChks(ck);
      for(const[k,col]of Object.entries(COLS))addList(k,col,await docs(db.collection(col),col));
      (await docs(AU,"alunos")).forEach(d=>remote(d.id,d.data()));watchAlunos(AU);
      if(!(SESS.role==="personal"&&SESS.back==="admin"))setSess({role:"admin"});
    }else if(F.role==="personal"){
      (await docs(P.where("status","==","ativo"),"personais")).forEach(d=>addPersonal(d.id,d.data()));
      const mine=await one(P.doc(u.uid),"personal"),priv=await one(PV.doc(u.uid),"personaisPriv");if(mine)addPersonal(u.uid,mine,priv||{});
      const by=c=>docs(db.collection(c).where("pid","==",u.uid),c);
      const [pg,rp,ck]=await Promise.all([by("pagamentos"),by("repasses"),by("checkins")]);addPays(pg);addReps(rp);addChks(ck);
      if(mine&&mine.status==="ativo"){const q=AU.where("pid","==",u.uid);(await docs(q,"alunos")).forEach(d=>remote(d.id,d.data()));watchAlunos(q)}
      setSess({role:"personal",pid:u.uid});
    }else if(F.role==="aluno"){
      (await docs(P.where("status","==","ativo"),"personais")).forEach(d=>addPersonal(d.id,d.data()));
      ME=u.uid;const mine=await one(AU.doc(u.uid),"aluno");
      if(mine){remote(u.uid,mine);subs.push(AU.doc(u.uid).onSnapshot(d=>{if(d.exists){remote(u.uid,d.data(),d.metadata.hasPendingWrites);rerender()}},e=>warn("aluno",e)))}
      const by=c=>docs(db.collection(c).where("cid","==",u.uid),c);
      addPays(await by("pagamentos"));addList("ratings","avaliacoes",await by("avaliacoes"));
      setSess({});
    }else{
      /* conta recém-criada, ainda sem tipo: só o que é público */
      (await docs(P.where("status","==","ativo"),"personais")).forEach(d=>addPersonal(d.id,d.data()));
    }
    finish();
  }
  function finish(){syncPrices();F.ready=true}

  /* ---------- alunos: grava só os campos que mudaram ---------- */
  const snap=o=>{const r={};Object.keys(o).forEach(k=>r[k]=J(o[k]));return r};
  function remote(id,data,pending){
    if(pending)return;
    let a=A(id);
    if(!a){if(id===ME){S=Object.assign(fresh(),data);SYNC[id]=snap(data);return}AL[id]=data;SYNC[id]=snap(data);return}
    const prev=SYNC[id]||{};
    Object.keys(data).forEach(k=>{const jr=J(data[k]);if(prev[k]===undefined||J(a[k])===prev[k])a[k]=data[k];prev[k]=jr});
    SYNC[id]=prev;
  }
  function alunoDoc(a){const d=clean(a);delete d.account;delete d.loggedOut;return d}
  function saveAluno(id){clearTimeout(timers[id]);timers[id]=setTimeout(()=>flushAluno(id),250)}
  function flushAluno(id){
    const a=A(id);if(!a||!F.ready)return;const d=alunoDoc(a),ref=db.collection("alunos").doc(id),prev=SYNC[id];
    if(!prev){SYNC[id]=snap(d);ref.set(d).catch(e=>{delete SYNC[id];warn("salvar aluno",e)});return}
    const up={},keys=new Set([...Object.keys(d),...Object.keys(prev)]);
    keys.forEach(k=>{const j=J(d[k]);if(j===prev[k])return;
      if(d[k]===undefined){if(prev[k]!=="null")up[k]=FV.delete();return}
      if(k==="messages"&&prev[k]){const old=JSON.parse(prev[k])||[];if(Array.isArray(old)&&d[k].length>old.length&&old.every((m,i)=>J(m)===J(d[k][i]))){up[k]=FV.arrayUnion(...d[k].slice(old.length));return}}
      up[k]=d[k]});
    if(!Object.keys(up).length)return;
    const was={};Object.keys(up).forEach(k=>{was[k]=prev[k];prev[k]=J(d[k])});
    ref.update(up).catch(e=>{Object.assign(prev,was);warn("salvar aluno",e)});
  }

  /* ---------- dados da empresa: compara com o que veio do banco e grava a diferença ---------- */
  function payDoc(k){const[cid,mes]=k.split("|"),c=typeof findC==="function"?findC(cid):null,pi=DB.payInfo[k]||{};
    return{cid,mes,pid:PAYPID[k]!==undefined?PAYPID[k]:(c&&c.pid)||null,paid:!!DB.paid[k],informado:!!DB.informed[k],metodo:pi.m||null,at:pi.at||null}}
  function saveDB(){if(!F.ready)return;clearTimeout(dbTimer);dbTimer=setTimeout(flushDB,200)}
  function put(col,id,data,map,j){map[id]=j;db.collection(col).doc(id).set(data).catch(e=>{delete map[id];warn("salvar "+col,e)})}
  function del(col,id,map){delete map[id];db.collection(col).doc(id).delete().catch(e=>warn("apagar "+col,e))}
  function flushDB(){
    if(!F.ready)return;
    for(const[k,col]of Object.entries(COLS)){const seen=new Set;
      (DB[k]||[]).forEach(o=>{if(!o.id)return;seen.add(o.id);const j=J(o);if(DBS[col][o.id]!==j){const d=clean(o);delete d.id;put(col,o.id,d,DBS[col],j)}});
      Object.keys(DBS[col]).forEach(id=>{if(!seen.has(id))del(col,id,DBS[col])})}
    const seenP=new Set;
    DB.personals.forEach(p=>{seenP.add(p.id);const pub=pick(p,PUB),priv=pick(p,PRIV),jp=J(pub),jv=J(priv);
      if(DBS.personais[p.id]!==jp)put("personais",p.id,clean(pub),DBS.personais,jp);
      if(DBS.priv[p.id]!==jv)put("personaisPriv",p.id,clean(priv),DBS.priv,jv)});
    Object.keys(DBS.personais).forEach(id=>{if(!seenP.has(id)){del("personais",id,DBS.personais);del("personaisPriv",id,DBS.priv)}});
    new Set([...Object.keys(DB.paid),...Object.keys(DB.payInfo),...Object.keys(DB.informed)]).forEach(k=>{const d=payDoc(k),j=J(d);if(DBS.pag[k]!==j){PAYPID[k]=d.pid;put("pagamentos",k,d,DBS.pag,j)}});
    Object.keys(DB.payouts).forEach(k=>{const j=J(DB.payouts[k]);if(DBS.rep[k]!==j)put("repasses",k,{pid:k.split("|")[0],at:DB.payouts[k]},DBS.rep,j)});
    Object.keys(DBS.rep).forEach(k=>{if(!(k in DB.payouts))del("repasses",k,DBS.rep)});
    Object.keys(DB.checkins).forEach(k=>{const c=DB.checkins[k],j=J(c);if(DBS.chk[k]!==j){const b=bookingsAll().find(x=>x.id===k)||{};put("checkins",k,{pid:b.pid||null,cid:b.cid||null,in:c.in||null,out:c.out||null},DBS.chk,j)}});
    const jc=J(pick(DB,CFG));if(DBS.cfg!==jc&&F.role==="admin"){DBS.cfg=jc;db.collection("config").doc("empresa").set(clean(pick(DB,CFG))).catch(e=>warn("salvar config",e))}
    const ji=J(pick(DB,CFGI));if(DBS.cfgi!==ji&&F.role==="admin"){DBS.cfgi=ji;db.collection("config").doc("interno").set(clean(pick(DB,CFGI))).catch(e=>warn("salvar config",e))}
  }

  /* ---------- redesenhar quando chega novidade do banco ---------- */
  function rerender(){if(!F.booted)return;clearTimeout(rr);rr=setTimeout(()=>{
    const el=document.activeElement,typing=el&&/INPUT|TEXTAREA|SELECT/.test(el.tagName)&&el.value;
    if(typing||document.querySelector(".modal,.drawer,.player")){rerender();return}route(true)},typingDelay())}
  const typingDelay=()=>{const el=document.activeElement;return el&&/INPUT|TEXTAREA|SELECT/.test(el.tagName)&&el.value?2000:150};

  /* ---------- contas ---------- */

})();

/* movimento da página inicial: fundo vivo, título que entra, blocos que aparecem ao rolar, números que contam */
let FX={};

  /* faixa de frases depois dos números */

  const count=({b,n,suf})=>{if(calm||!n){b.textContent=n+suf;return}const t0=performance.now(),st=t=>{const q=Math.min(1,(t-t0)/1300);b.textContent=Math.round(n*(1-Math.pow(1-q,3)))+suf;if(q<1)requestAnimationFrame(st)};b.textContent="0"+suf;requestAnimationFrame(st)};
  /* aparecer ao rolar, um depois do outro */

function weekStrip(){

/* respiração guiada */
const BREATH={"4-6":[4,0,6],"4-4-4":[4,4,4],"4-7-8":[4,7,8]};
let B=null;
function breathe(){
  if(B)return;B={pat:"4-6",run:false,left:120,t:null,phase:0,pt:0};
  const el=document.createElement("div");el.className="player";el.id="breath";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Respiração guiada");document.body.appendChild(el);document.body.style.overflow="hidden";renderB();
}
function renderB(){
  const el=$("#breath");const mm=Math.floor(B.left/60),ss=String(B.left%60).padStart(2,"0");
  el.innerHTML=`<div class="ph"><button class="rbtn" id="bclose" aria-label="Fechar"><i data-lucide="x"></i></button><div><b>Pausa para respirar</b><div style="font-size:13px;color:var(--muted)">2 minutos · pode ser sentado ou deitado</div></div></div>
  <div class="pbody"><div class="breath-stage"><div class="bcircle" id="bc"><span id="bl" aria-live="polite">${B.run?"":"Pronto?"}</span></div></div>
    <p class="bcount" id="bt">${mm}:${ss} restantes</p>
    ${B.run?"":`<p class="exhint" style="margin-top:14px">Acompanhe o círculo: ele cresce quando você puxa o ar e diminui quando solta. Se ficar desconfortável, volte a respirar normalmente.</p>
    <div class="bpick" role="group" aria-label="Ritmo">${Object.keys(BREATH).map(k=>`<button aria-pressed="${B.pat===k}" data-bp="${k}">${k}</button>`).join("")}</div>
    <p class="exhint" style="margin-top:8px">${B.pat==="4-6"?"Puxa em 4, solta em 6. O mais simples para acalmar.":B.pat==="4-4-4"?"Puxa em 4, segura 4, solta em 4.":"Puxa em 4, segura 7, solta em 8. Bom para antes de dormir."}</p>`}</div>
  <div class="pfoot"><div class="in"><button class="btn btn-primary" id="bgo"><i data-lucide="${B.run?"square":"play"}"></i>${B.run?"Encerrar":"Começar"}</button></div></div>`;
  icons();
  $("#bclose").onclick=()=>closeB(false);
  el.querySelectorAll("[data-bp]").forEach(b=>b.onclick=()=>{B.pat=b.dataset.bp;renderB()});
  $("#bgo").onclick=()=>{if(B.run){closeB(B.left<=90);return}B.run=true;wake(true);renderB();B.phase=-1;B.pt=0;stepB();B.t=setInterval(tickB,1000)};
}
function stepB(){
  const seq=BREATH[B.pat];do{B.phase=(B.phase+1)%3}while(!seq[B.phase]);B.pt=seq[B.phase];
  const c=$("#bc"),l=$("#bl");if(!c)return;

  l.textContent=["Puxe o ar","Segure","Solte devagar"][B.phase];
}
function tickB(){B.left--;B.pt--;const t=$("#bt");if(t)t.textContent=Math.floor(B.left/60)+":"+String(B.left%60).padStart(2,"0")+" restantes";if(B.left<=0){closeB(true);return}if(B.pt<=0)stepB()}
function closeB(done){if(!B)return;clearInterval(B.t);wake(false);const el=$("#breath");if(el)el.remove();document.body.style.overflow="";B=null;
  if(done){S.breaths=S.breaths||[];S.breaths.push(Date.now());save();toast("Respiração registrada. Isso também conta!")}route(true)}

  $("#pclose").onclick=closeP;$("#pskip").onclick=()=>advance(true);
  $("#psnd").onclick=()=>{S.sound=!S.sound;save();renderP()};
  $("#pplay").onclick=()=>{P.run=!P.run;P.started=true;clearInterval(P.int);if(P.run){beep(880);wake(true);P.int=setInterval(tick,1000)}else wake(false);renderP()};
  icons();
}
function tick(){P.left--;if(P.left<=0){advance(false);return}
  if(P.left<=3)beep(520,90);
  const t=$("#ptm"),r=$("#rfg"),tr=$("#ptr");if(t)t.textContent=fmt(P.left);if(r)r.style.strokeDashoffset=ringOff();
  if(tr&&!P.rest){const sec=P.w.ex[P.i][1];tr.style.width=Math.round((P.i+1-P.left/sec)/P.w.ex.length*100)+"%"}}
/* ao fim de um exercício entra um descanso curto; ao fim do descanso, o próximo começa sozinho */
function advance(manual){
  const last=P.i>=P.w.ex.length-1;
  if(!P.rest&&last){clearInterval(P.int);P.run=false;beep(990,300);P.finished=true;renderP();return}
  if(!P.rest){P.rest=true;P.left=REST}else{P.rest=false;P.i++;P.left=P.w.ex[P.i][1]}
  if(!manual)beep(P.rest?660:880);
  renderP();
}
function closeP(){if(P)clearInterval(P.int);wake(false);const el=$("#player");if(el)el.remove();document.body.style.overflow="";P=null;route(true)}

function reply(t){t=t.toLowerCase();
  if(t.includes("vergonha")||t.includes("medo"))return"Isso é muito comum e faz total sentido. Por isso a gente começa em casa, sem ninguém olhando. Vamos no seu tempo, combinado?";
  if(t.includes("sentad")||t.includes("cadeira"))return"Pode sim! O treino \"Força na cadeira\" e o de mobilidade são feitos sentado. Posso adaptar outros também.";
  if(t.includes("não estou bem")||t.includes("nao estou bem")||t.includes("triste"))return"Obrigado por me contar. Hoje pode ser só uma respiração de 5 minutos, ou descanso mesmo. Se estiver muito difícil, o CVV atende 24h pelo 188. Estou aqui.";
  if(t.includes("horário")||t.includes("horario"))return"Claro! Pode escolher outro horário na aba Agenda e cancelar o antigo.";
  if(t.includes("dor"))return"Se sentir dor, pare o exercício. Me conta onde está doendo para eu ajustar o seu treino.";

}

function myBills(){const all=bills().filter(b=>b.cid===ME).reverse();
  if(!all.length)return`<div class="empty">Nenhuma cobrança ainda.</div>`;
  const open=all.filter(b=>!b.paid),bl=open.length?open:all.slice(0,1),rest=all.filter(b=>!bl.includes(b));
  const row=b=>{const[k,ic,t]=BILL_PILL[b.status];return`<div><i data-lucide="receipt"></i><span><b>${mlabel(b.m,1)}</b> · ${money(b.amount)}<br><small style="margin:0">Nível ${b.lv} · vence dia 10</small></span><small style="display:flex;gap:8px;align-items:center">${b.paid||b.status==="informado"?pill(k,ic,t):b.lv===1&&!S.talked&&!TEST_MODE?`<span style="color:var(--muted);font-size:12.5px;text-align:right">Libera depois da conversa grátis</span>`:`${pill(k,ic,t)}<button class="btn btn-primary btn-sm" data-mypay="${b.key}">Pagar</button>`}</small></div>`};
  return`<div class="hist">${bl.map(row).join("")}</div>${rest.length?`<details class="fold" style="margin-top:10px"><summary><span class="fs" style="margin:0">Ver histórico (${rest.length})</span><i data-lucide="chevron-down"></i></summary><div class="hist">${rest.map(row).join("")}</div></details>`:""}
  <p class="note" style="margin-top:10px"><i data-lucide="${METHODS[S.payMethod||"pix"].ic}"></i>Forma preferida: ${METHODS[S.payMethod||"pix"].l}${S.autopay?" · cobrança automática ligada":""}. Pagamentos ilustrativos por enquanto.</p>`}
function weeksChart(){const w0=sod()-((new Date().getDay()+6)%7)*D1,data=[];
  for(let i=5;i>=0;i--){const a=w0-i*7*D1,b=a+7*D1,n=S.workouts.filter(x=>x.at>=a&&x.at<b).length+(S.breaths||[]).filter(x=>x>=a&&x<b).length;
    data.push({label:i===0?"Esta semana":i===1?"Semana passada":`Há ${i} semanas`,short:new Date(a).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}),v:n})}
  return vbars(data,v=>String(Math.round(v)))}
function feelHist(){
  const FI={"Leve":"smile","Bom":"thumbs-up","Cansativo":"wind","Difícil":"frown"};
  const items=[...S.workouts.map(w=>({at:w.at,t:(WORKOUTS.find(x=>x.id===w.id)||{}).t,f:w.feel})),...(S.breaths||[]).map(b=>({at:b,t:"Pausa para respirar",f:null}))].sort((a,b)=>b.at-a.at).slice(0,4);
  if(!items.length)return`<div class="empty">Depois de cada treino você conta como se sentiu, e isso aparece aqui para você e seu professor acompanharem.</div>`;
  return`<div class="hist">${items.map(x=>`<div><i data-lucide="${x.f?FI[x.f]:"wind"}"></i><span><b>${x.t}</b>${x.f?` · ${x.f.toLowerCase()}`:""}</span><small>${new Date(x.at).toLocaleDateString("pt-BR",{day:"numeric",month:"short"}).replace(".","")}</small></div>`).join("")}</div>`;
}

function billsOf(db,list){const out=[],ms=monthsBack(6),cur=mkey(Date.now());

    const ago=5-idx;let lv=A(c.id)?c.level:Math.max(1,c.level-Math.floor(ago/2));
    if(lv===1&&m!==sm){if(c.level===1)return;lv=2}
    out.push({key:c.id+"|"+m,cid:c.id,pid:c.pid,m,lv,amount:db.prices[lv-1]})}));return out}

/* barras verticais de uma série: rótulo só no último valor, o resto no toque/hover */
function vbars(data,fmt=money){const W=560,H=210,pl=52,pr=8,pt=26,pb=28,iw=W-pl-pr,ih=H-pt-pb,max=niceMax(Math.max(...data.map(d=>d.v),1)),cw=iw/data.length,bw=Math.min(46,cw*.55);
  const y=v=>pt+ih-(v/max)*ih;
  const grid=[0,.5,1].map(f=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(max*f)}" y2="${y(max*f)}"/><text class="ax" x="${pl-8}" y="${y(max*f)+4}" text-anchor="end">${fmt(max*f).replace("R$ ","")}</text>`).join("");
  const bars=data.map((d,i)=>{const x=pl+cw*i+(cw-bw)/2,h=Math.max(0,ih*d.v/max);
    return`<g data-tip="${esc(d.label)}: ${esc(fmt(d.v))}"><rect class="hit" x="${pl+cw*i}" y="${pt}" width="${cw}" height="${ih}"/>${h?`<path class="bar" d="${rtop(x,y(d.v),bw,h,4)}"/>`:""}<text class="ax" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(d.short||d.label)}</text>${i===data.length-1?`<text class="vl" x="${x+bw/2}" y="${y(d.v)-8}" text-anchor="middle">${esc(fmt(d.v))}</text>`:""}</g>`}).join("");
  return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(data.map(d=>d.label+": "+fmt(d.v)).join("; "))}">${grid}${bars}</svg></div>`}
function hbars(data,fmt=v=>v){const max=Math.max(...data.map(d=>d.v),1);return`<div class="hb ${fmt===money?"wide":""}">${data.map(d=>`<div data-tip="${esc(d.label)}: ${esc(fmt(d.v))}"><span>${esc(d.label)}</span><i style="width:${d.v/max*100}%"></i><b>${esc(fmt(d.v))}</b></div>`).join("")}</div>`}

function setBk(b,status,skipCount){
  const a=A(b.cid);if(a){const x=(a.bookings||[]).find(y=>b.cid+"-"+y.ts===b.id);if(!x)return;
    if(status==="cancelado"){a.bookings=a.bookings.filter(y=>y!==x);a.messages.push({from:"them",text:`Precisei cancelar nosso horário de ${dlabel(b.ts).toLowerCase()} às ${hm(b.ts)}. Vamos remarcar?`,t:nowT()});a.unread++}
    else{x.done=true;if(!skipCount){if(b.type==="Ao ar livre")a.outdoor++;if(b.type==="Academia")a.gymsessions++}if(b.type==="Primeira conversa")a.talked=true}
    saveA(b.cid);return}
  const x=DB.bookings.find(y=>y.id===b.id);x.status=status;
  if(status==="feito"&&!skipCount){const c=DB.clients.find(y=>y.id===b.cid);if(c){if(b.type==="Ao ar livre")c.outdoor++;if(b.type==="Academia")c.gym++;if(b.type==="Primeira conversa")c.talked=true}}
  saveDB()}

/* ================== FINANCEIRO ==================
   Cada mensalidade paga se divide em: parte do professor (% dele), taxa de pagamento e o que fica com a empresa. */
const splitOf=pid=>{const p=findP(pid);return((p&&p.split!=null?p.split:DB.split))/100};
/* taxa média ponderada pelas formas usadas nas mensalidades pagas */
const feeOf=()=>{const pb=bills().filter(b=>b.paid);return pb.length?pb.reduce((s,b)=>s+feeFor(b),0)/pb.length:(DB.fees?DB.fees.pix:0.99)/100};
const pctf=v=>(Math.round(v*1000)/10).toLocaleString("pt-BR")+"%";
function fin(list){const r={fat:0,rec:0,open:0,late:0,rep:0,tax:0,emp:0,n:list.length,paidN:0};
  list.forEach(b=>{r.fat+=b.amount;if(b.paid){r.paidN++;r.rec+=b.amount;const rp=b.amount*splitOf(b.pid),tx=b.amount*feeFor(b);r.rep+=rp;r.tax+=tx;r.emp+=b.amount-rp-tx}else{r.open+=b.amount;if(b.status==="atrasado")r.late+=b.amount}});
  r.margin=r.rec?r.emp/r.rec:0;return r}
const payoutKey=(pid,m)=>pid+"|"+m;
/* repasses dos meses já fechados vêm marcados como pagos nos dados de exemplo */
function seedFin(db){db.payouts={};monthsBack(6).slice(0,4).forEach(m=>db.personals.forEach(p=>{if(p.status==="ativo")db.payouts[p.id+"|"+m]=new Date(m+"-05T12:00").getTime()+30*D1}));db.personals.forEach(p=>{if(p.split==null)p.split=p.id==="p1"?70:65});return db}
if(!DB.payouts){seedFin(DB);saveDB()}

/* barras empilhadas de duas séries, com legenda e total no último mês */
function sbars(data,names,fmt=money){const W=560,H=230,pl=52,pr=8,pt=30,pb=28,iw=W-pl-pr,ih=H-pt-pb,max=niceMax(Math.max(...data.map(d=>d.a+d.b),100)),cw=iw/data.length,bw=Math.min(46,cw*.55),y=v=>pt+ih-(v/max)*ih;
  const grid=[0,.5,1].map(f=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(max*f)}" y2="${y(max*f)}"/><text class="ax" x="${pl-8}" y="${y(max*f)+4}" text-anchor="end">${fmt(max*f).replace("R$ ","")}</text>`).join("");
  const bars=data.map((d,i)=>{const x=pl+cw*i+(cw-bw)/2,ha=ih*d.a/max,hb=ih*d.b/max,gap=d.a&&d.b?2:0,top=y(d.a+d.b);

/* desenho de QR apenas ilustrativo (não é um código Pix válido) */
function fakeQR(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;const n=25,cells=[];const rnd=()=>(h=(h*1103515245+12345)>>>0)/4294967296;
  const finder=(x,y)=>[[x,y,7,7,1],[x+1,y+1,5,5,0],[x+2,y+2,3,3,1]];
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);if(!inF&&rnd()<.5)cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`)}

let PL={per:3,freq:{3:2,4:2},q:{},shown:{}};

const discOf=per=>((DB.disc||{1:0,3:10,6:15})[per]||0)/100;

/* ================== EXERCÍCIOS COM DEMONSTRAÇÃO ==================

const OFFPLAT=/(\(?\b\d{2}\)?\s?9?\d{4}[-\s.]?\d{4}\b)|whats|zap\b|telegram|pix\s*(direto|pra mim|pra você|meu)|me paga (direto|no pix)|por fora|fora do app|fora da plataforma|direto comigo|meu (n[uú]mero|contato|insta|telefone|celular)|instagram|\binsta\b|@[a-z0-9_.]{3,}|sem (a )?(empresa|plataforma|app)|mais barato (comigo|direto)/i;
function offCheck(text,from,cid,pid,send,keep){
  if(!OFFPLAT.test(text))return send();
  const c=findC(cid),p=findP(pid);
  const log=()=>{DB.flags=DB.flags||[];DB.flags.push({id:"f"+Date.now(),from,cid,pid,cname:c?c.name:"",pname:p?p.name:"",text,at:Date.now(),status:"aberto"});saveDB()};
  if(from==="personal")sheet("shield-alert","Contato ou pagamento por fora?","Esta mensagem parece combinar contato ou pagamento fora da plataforma. Isso vai contra o item 4 do termo de parceria (não aliciamento). Se enviar, ela fica registrada para a empresa.","Enviar mesmo assim",{danger:true,cancel:"Editar mensagem",onOk:()=>{log();send()}});
  else sheet("shield-check","Combine tudo pelo app","Por segurança, aulas e pagamentos ficam sempre pela plataforma. Por fora não há verificação, código do encontro, central de apoio nem garantia.","Enviar mesmo assim",{cancel:"Editar mensagem",onOk:()=>{log();send()}});
  keep(text);
}

  $("[data-delme]").onclick=()=>sheet("trash-2","Pedir exclusão dos dados?","Para excluir seus dados, a parceria precisa ser encerrada (aviso de 30 dias). Registros financeiros e o termo ficam guardados pelo prazo que a lei exige.","Enviar pedido",{danger:true,cancel:"Cancelar",onOk:()=>{DB.leads.push({id:"l"+Date.now(),type:"personal",name:p.name,contact:p.email,msg:"Pedido de exclusão de dados e encerramento da parceria (LGPD).",at:Date.now(),status:"novo"});saveDB();toast("Pedido enviado à empresa");route(true)}});
}
/* empresa: ficha completa do professor */
function openPFicha(id){const p=findP(id),inf=p.info||{},s=p.safety||{},po=p.payout||{},r=ratingOf(p.id),n=allClients().filter(c=>c.pid===p.id&&c.status==="ativo").length;
  const m=document.createElement("div");m.className="drawer";document.body.appendChild(m);document.body.style.overflow="hidden";
  const close=()=>{removeEventListener("keydown",k);m.remove();document.body.style.overflow="";route(true)};const k=e=>{if(e.key==="Escape")close()};addEventListener("keydown",k);m.onclick=e=>{if(e.target===m)close()};
  m.innerHTML=`<div class="dp" role="dialog" aria-modal="true" aria-labelledby="pfh"><div class="dp-h"><span class="av">${esc(initials(p.name))}</span><div><h2 id="pfh">${esc(p.name)}</h2><small style="color:var(--muted)">${esc(p.cref)} · ${esc(p.area)}</small></div><button class="rbtn" id="pfx" aria-label="Fechar"><i data-lucide="x"></i></button></div>
    <div class="sec2"><h3>Dados pessoais</h3><div class="plist">${dline("E-mail",esc(p.email||"—"))}${dline("Celular",esc(inf.tel||"—"))}${dline("CPF",esc(inf.cpf||"***.***.***-**"))}${dline("Nascimento",inf.birth?new Date(inf.birth+"T12:00").toLocaleDateString("pt-BR"):"—")}${dline("Endereço",esc([inf.addr,inf.num&&"nº "+inf.num,inf.city].filter(Boolean).join(", ")||"—"))}</div></div>
    <div class="sec2"><h3>Contrato</h3><div class="plist">${dline("Termo de parceria",p.terms?`Aceito ${new Date(p.terms.at).toLocaleDateString("pt-BR")} · v${p.terms.v}`:"Pendente")}${dline("Percentual",pctf(splitOf(p.id)))}${dline("Recebimento",`Pix ${esc(po.type||"")} ${esc(po.key||"não cadastrado")}`)}${dline("Alunos ativos",`${n} de ${p.cap}`)}${dline("Avaliação (confidencial)",r.n?`${r.avg.toLocaleString("pt-BR",{maximumFractionDigits:1})} ★ · ${r.n} avaliações`:"—")}</div></div>
    <div class="sec2"><h3>Documentos</h3><div class="chk">${[["doc","Documento com foto"],["selfie","Selfie"],["cref","CREF"],["crim","Antecedentes criminais"]].map(([k2,t])=>`<div class="${s[k2]?"y":""}"><i data-lucide="${s[k2]?"circle-check":"circle-dashed"}"></i>${t}</div>`).join("")}</div></div>
    <div class="sec2"><button class="btn btn-ghost btn-sm" id="pft"><i data-lucide="file-text"></i>Ver termo de parceria</button></div></div>`;
  icons();$("#pfx").onclick=close;$("#pft").onclick=()=>openTerms("personal",{onClose:()=>{}});}
function seedInfo(db){const I={p1:{tel:"(11) 90000-0101",cpf:"***.321.654-**",birth:"1989-03-14",addr:"Rua das Flores",num:"120",city:"São Paulo"},p2:{tel:"(11) 90000-0202",cpf:"***.987.123-**",birth:"1992-08-02",addr:"Rua Voluntários da Pátria",num:"850",city:"Rio de Janeiro"},p3:{tel:"(11) 90000-0303",cpf:"***.555.222-**",birth:"1985-11-20",addr:"Av. Afonso Pena",num:"45",city:"Belo Horizonte"}};
  db.personals.forEach(p=>{if(!p.info)p.info=Object.assign({name:p.name,email:p.email||mailOf(p.name)},I[p.id]||{})});return db}
if(!DB.personals.some(p=>p.info)){seedInfo(DB);saveDB()}
/* dados de exemplo antigos (só São Paulo) passam a ser nacionais */
(()=>{let ch=false;const NP={p1:{uf:"SP",area:"São Paulo / SP",bio:"Especialista em atividade física adaptada e em iniciantes. Atende online em todo o Brasil e presencial em São Paulo."},p2:{uf:"RJ",area:"Rio de Janeiro / RJ",cref:"CREF 000001-G/RJ"},p3:{uf:"MG",area:"Belo Horizonte / MG",cref:"CREF 000002-G/MG"}};
  DB.personals.forEach(p=>{if(!p.uf&&NP[p.id]){Object.assign(p,NP[p.id]);ch=true}});
  const CUF=[["SP","São Paulo"],["RJ","Rio de Janeiro"],["PE","Recife"],["PR","Curitiba"],["RS","Porto Alegre"],["MG","Belo Horizonte"],["BA","Salvador"],["CE","Fortaleza"],["DF","Brasília"],["GO","Goiânia"],["AM","Manaus"],["SC","Florianópolis"]];
  DB.clients.forEach((c,i)=>{if(!c.uf){c.uf=CUF[i%12][0];c.city=CUF[i%12][1];ch=true}});if(ch)saveDB()})();

function bindSiteForms(){
  const f1=$("#fc");if(f1)f1.onsubmit=e=>{e.preventDefault();DB.leads.push({id:"l"+Date.now(),type:"cliente",name:$("#fcn").value.trim(),contact:$("#fcc").value.trim(),msg:$("#fcm").value.trim()||"Quero saber mais.",at:Date.now(),status:"novo"});saveDB();f1.reset();toast("Mensagem enviada! Vamos responder em até 1 dia útil.")};
  const f2=$("#fp");if(f2)f2.onsubmit=e=>{e.preventDefault();DB.leads.push({id:"l"+Date.now(),type:"personal",name:$("#fpn").value.trim(),contact:$("#fpc").value.trim(),cref:"CREF "+$("#fpr").value.trim(),area:$("#fpa").value.trim()+" / "+$("#fpu").value,uf:$("#fpu").value,msg:"Quero ser professor parceiro.",at:Date.now(),status:"novo"});saveDB();f2.reset();toast("Cadastro recebido! Vamos analisar seu CREF e entrar em contato.")};
